<!DOCTYPE html>
<html>
  <head>
    <title>Invoice Checker — Login</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/login/style.css">
    <script src="/login/script.js" defer></script>
  </head>
  <body>
 
    <div class="login-root">
 
      <!-- LEFT SIDE -->
      <div class="login-side">
        <div class="login-side-brand">Reference Number</div>
        <div>
          <div class="login-side-title">Generates Reference Number</div>
          <div class="login-side-sub">Confidential+</div>
        </div>
        <div class="login-side-dots">
          <span class="active"></span>
          <span></span>
          <span></span>
        </div>
      </div>
 
      <!-- RIGHT SIDE -->
      <div class="login-main">
        <p class="login-heading">Welcome back</p>
        <p class="login-sub">Sign in to your account to continue</p>
 
        <div id="errorMsg" class="error-msg" style="display:none;"></div>
 
        <div class="field">
          <label for="username">Username</label>
          <div class="input-wrap">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="username" placeholder="Enter your username" autocomplete="off">
          </div>
        </div>
 
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" placeholder="••••••••">
          </div>
        </div>
 
        <div class="field-row">
          <label class="remember">
            <input type="checkbox" id="rememberMe"> Remember me
          </label>
          <a class="forgot">Forgot password?</a>
        </div>
 
        <button class="btn-login">Sign in</button>
 
        <div class="login-footer">
          Don't have an account? Email at <a>sabin.ishimwe21@gmail.com</a>
        </div>
      </div>
 
    </div>
 
  </body>
</html>
