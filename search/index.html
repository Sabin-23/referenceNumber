<!DOCTYPE html>
<html>
    <head>
        <title>Search</title>
        <meta charset="utf-8">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
        <link rel="icon" href="/images/cropped-Best-law-firm-in-region-32x32.png" type="image/x-icon">
        <link rel="stylesheet" href="../style.css">
        <link rel="stylesheet" href="/search/style.css">
        <script src="/search/script.js" defer></script>
        <style>
            *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
            :root {
                --primary: #EB6753;
                --primary-dark: #c94f3c;
                --accent: #790000;
                --bg: #f0efe9;
                --surface: #ffffff;
                --border: #e4e2db;
                --text-dark: #1a1a1a;
                --text-muted: #7a7a6e;
                --text-hint: #b0afa8;
                --radius: 14px;
                --radius-pill: 999px;
            }
 
            body {
                font-family: 'DM Sans', sans-serif;
                background: var(--bg);
                color: var(--text-dark);
                min-height: 100vh;
            }
 
            /* NAV */
            #navbar {
                background: var(--accent);
                padding: 0 2rem;
                position: sticky;
                top: 0;
                z-index: 100;
            }
            .nav-wrapper {
                max-width: 1000px;
                margin: 0 auto;
                height: 56px;
                display: flex;
                align-items: center;
                gap: 1rem;
            }
            .link-back { flex-shrink: 0; }
            .link-back a {
                width: 34px;
                height: 34px;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 50%;
                border: 1px solid rgba(255,255,255,0.15);
                color: rgba(255,255,255,0.55);
                font-size: 18px;
                text-decoration: none;
                transition: all 0.15s;
            }
            .link-back a:hover { background: rgba(255,255,255,0.08); color: #fff; }
            .nav-center h3 {
                font-family: 'DM Mono', monospace;
                font-size: 11px;
                font-weight: 400;
                letter-spacing: 0.18em;
                text-transform: uppercase;
                color: rgba(255,255,255,0.45);
            }
 
            /* HERO */
            .hero {
                min-height: 360px;
                background: var(--accent);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-align: center;
                padding: 56px 24px 60px;
                position: relative;
                overflow: hidden;
            }
            .hero::before {
                content: '';
                position: absolute;
                inset: 0;
                background: radial-gradient(ellipse at 65% 40%, rgba(235,103,83,0.18) 0%, transparent 65%);
                pointer-events: none;
            }
            .hero::after {
                content: '';
                position: absolute;
                bottom: -1px; left: 0; right: 0;
                height: 40px;
                background: var(--bg);
                clip-path: ellipse(55% 100% at 50% 100%);
            }
            .hero-eyebrow {
                font-family: 'DM Mono', monospace;
                font-size: 11px;
                letter-spacing: 0.2em;
                text-transform: uppercase;
                color: var(--primary);
                margin-bottom: 0.75rem;
                position: relative;
            }
            .hero h1 {
                font-family: 'Oleo Script Swash Caps', cursive;
                font-size: 48px;
                color: #fff;
                margin-bottom: 10px;
                position: relative;
                text-shadow: 0 4px 24px rgba(0,0,0,0.3);
            }
            .hero h1 span { color: #fff; }
            .hero p {
                color: rgba(255,255,255,0.5);
                font-size: 15px;
                margin-bottom: 36px;
                position: relative;
            }
 
            /* SEARCH BAR */
            .hero-search {
                display: flex;
                align-items: center;
                background: #fff;
                border-radius: var(--radius-pill);
                padding: 6px 6px 6px 24px;
                max-width: 580px;
                width: 100%;
                box-shadow: 0 16px 48px rgba(0,0,0,0.25);
                position: relative;
            }
            .hero-search input {
                flex: 1;
                border: none;
                outline: none;
                font-size: 15px;
                font-family: 'DM Sans', sans-serif;
                color: var(--text-dark);
                background: transparent;
            }
            .hero-search input::placeholder { color: var(--text-hint); }
            .hero-search button {
                background: var(--primary);
                color: #fff;
                border: none;
                padding: 11px 26px;
                border-radius: var(--radius-pill);
                font-weight: 600;
                font-size: 14px;
                cursor: pointer;
                font-family: 'DM Sans', sans-serif;
                display: flex;
                align-items: center;
                gap: 8px;
                white-space: nowrap;
                transition: background 0.15s, filter 0.2s, transform 0.1s;
            }
            .hero-search button:hover {
                background: var(--accent);
                filter: drop-shadow(0 5px 15px rgba(235,103,83,0.45));
                transform: translateY(-1px);
            }
            .hero-search button:active { transform: scale(0.97); }
 
            /* RESULTS AREA */
            .results-area {
                max-width: 860px;
                margin: 0 auto;
                padding: 2rem 1.5rem 5rem;
            }
 
            .results-meta {
                font-family: 'DM Mono', monospace;
                font-size: 11px;
                letter-spacing: 0.06em;
                color: var(--text-hint);
                margin-bottom: 1rem;
                min-height: 18px;
            }
 
            /* CARDS */
            .cards-grid {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
 
            /* individual card styles expected from script.js */
            .ref-card {
                display: flex;
                flex-direction: column;
                gap: 0;
                padding: 0;
                cursor: pointer;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                overflow: hidden;
                transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
                animation: fadeUp 0.2s ease both;
            }   
            .ref-card:hover {
                border-color: #c5c2bb;
                box-shadow: 0 4px 16px rgba(0,0,0,0.07);
                transform: translateY(-2px);
            }
            .ref-card-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0.75rem 1.25rem;
                background: var(--bg);
                border-bottom: 1px solid var(--border);
                gap: 12px;
                flex-wrap: wrap;
            }
            .ref-header-right {
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .ref-card:active { transform: scale(0.99); }
 
            @keyframes fadeUp {
                from { opacity: 0; transform: translateY(8px); }
                to   { opacity: 1; transform: translateY(0); }
            }
 
            .ref-id {
                font-family: 'DM Mono', monospace;
                font-size: 12px;
                font-weight: 500;
                color: var(--accent);
                letter-spacing: 0.04em;
                background: none;
                border: none;
                padding: 0;
            }
            .ref-body { min-width: 0; }
            .ref-name {
                font-size: 14px;
                font-weight: 500;
                color: var(--text-dark);
                margin-bottom: 3px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .ref-subject {
                font-size: 12px;
                color: var(--text-muted);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .ref-meta {
                display: flex;
                flex-direction: column;
                align-items: flex-end;
                gap: 5px;
                flex-shrink: 0;
            }
            .ref-date {
                font-family: 'DM Mono', monospace;
                font-size: 11px;
                color: var(--text-hint);
                display: flex;
                align-items: center;
                gap: 5px;
            }
            .ref-initial {
                font-family: 'DM Mono', monospace;
                font-size: 11px;
                font-weight: 600;
                background: #fde8e4;
                color: #a33a25;
                padding: 3px 10px;
                border-radius: 4px;
                letter-spacing: 0.05em;
            }
            .ref-card-body {
                padding: 1rem 1.25rem;
                display: flex;
                flex-direction: column;
                gap: 0.65rem;
            }
            .ref-address {
                color: var(--text-muted);
                font-size: 13px;
                line-height: 1.7;
            }
            .ref-row {
                display: grid;
                grid-template-columns: 140px 1fr;
                gap: 8px;
                align-items: center;
            }
            .ref-label {
                font-size: 11px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.07em;
                color: var(--text-hint);
                display: flex;
                align-items: center;
                gap: 6px;
                padding-top: 1px;
                overflow: hidden;
                white-space: nowrap;
            }
            .ref-label i { color: var(--primary); font-size: 12px; }
            .ref-value {
                font-size: 13.5px;
                color: var(--text-dark);
                line-height: 1.5;
            }
 
            mark {
                background: #fff3e0;
                color: #8a4a00;
                border-radius: 2px;
                padding: 0 2px;
            }
 
            /* EMPTY STATE */
            .empty-state {
                text-align: center;
                padding: 4rem 1rem;
                color: var(--text-hint);
            }
            .empty-state i { font-size: 2.5rem; display: block; margin-bottom: 0.75rem; opacity: 0.25; }
            .empty-state p { font-size: 14px; }
 
            /* RESPONSIVE */
            @media (max-width: 560px) {
                .hero h1 { font-size: 34px; }
                .ref-card { grid-template-columns: 1fr auto; }
                .ref-id { display: none; }
                .results-area { padding: 1.5rem 1rem 4rem; }
            }
                    .hero-by { font-family: "DM Sans", sans-serif; font-size: 18px; font-weight: 300; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.45); display: block; margin-bottom: 6px; }
            .hero-name { font-family: "Playfair Display", serif; font-size: 58px; font-weight: 700; font-style: italic; color: #790000; text-shadow: 0 2px 32px rgba(121,0,0,0.45); display: block; line-height: 1.1; }
            .hero h1 { font-family: inherit; font-size: inherit; color: inherit; text-shadow: none; margin-bottom: 14px; }
        </style>
    </head>
    <body>
        <nav id="navbar">
            <div class="nav-wrapper" id="navWrapper">
                <div class="link-back">
                    <a href="../"><i class="fa fa-angle-left"></i></a>
                </div>
                <div class="nav-center">
                    <h3>Reference Number</h3>
                </div>
            </div>
        </nav>

        <section class="hero">
            <h1><span class="hero-by">Search by</span><br><span class="hero-name">Law Firm Personnel Name</span></h1>
            <p>Find any reference number instantly.</p>
            <div class="hero-search">
                <input type="text" id="heroSearch" placeholder="Search by client name ..." autocomplete="off">
                <button><i class="fa-solid fa-magnifying-glass"></i> Search</button>
            </div>
        </section>
        <div class="results-area">
            <p class="results-meta" id="resultsMeta"></p>
            <div class="cards-grid" id="cardsGrid"></div>
        </div>
    </body>
</html>
